name: Bot AI Stockity

on:
  workflow_dispatch:
  schedule:
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"

permissions:
  contents: read

jobs:
  signal:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install requests
        run: python -m pip install requests

      - name: Generate and send signal
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import requests
          from datetime import datetime, timezone, timedelta

          token = os.environ.get("TELEGRAM_TOKEN", "").strip()
          chat_id = os.environ.get("TELEGRAM_CHAT_ID", "").strip()

          if not token or not chat_id:
              raise SystemExit(
                  "Secrets tidak terbaca. Periksa TELEGRAM_TOKEN "
                  "dan TELEGRAM_CHAT_ID di Repository secrets."
              )

          # Ambil candle BTC-USDT dari OKX
          r = requests.get(
              "https://www.okx.com/api/v5/market/candles",
              params={
                  "instId": "BTC-USDT",
                  "bar": "5m",
                  "limit": "100"
              },
              timeout=20
          )
          r.raise_for_status()
          data = r.json()

          if data.get("code") != "0":
              raise SystemExit("OKX error: " + str(data.get("msg")))

          # Gunakan candle yang sudah selesai saja
          candles = []
          for row in data.get("data", []):
              if row[8] == "1":
                  candles.append({
                      "time": int(row[0]),
                      "open": float(row[1]),
                      "close": float(row[4])
                  })

          candles.sort(key=lambda x: x["time"])

          if len(candles) < 30:
              raise SystemExit("Data candle selesai tidak cukup.")

          closes = [c["close"] for c in candles]

          def ema(values, period):
              alpha = 2 / (period + 1)
              value = values[0]
              for price in values[1:]:
                  value = alpha * price + (1 - alpha) * value
              return value

          def rsi(values, period=14):
              changes = [
                  values[i] - values[i - 1]
                  for i in range(1, len(values))
              ]
              gains = [max(x, 0) for x in changes]
              losses = [max(-x, 0) for x in changes]

              avg_gain = sum(gains[:period]) / period
              avg_loss = sum(losses[:period]) / period

              for i in range(period, len(changes)):
                  avg_gain = (
                      avg_gain * (period - 1) + gains[i]
                  ) / period
                  avg_loss = (
                      avg_loss * (period - 1) + losses[i]
                  ) / period

              if avg_loss == 0:
                  return 100 if avg_gain > 0 else 50

              return 100 - 100 / (1 + avg_gain / avg_loss)

          e9 = ema(closes, 9)
          e21 = ema(closes, 21)
          rv = rsi(closes)

          last5 = candles[-5:]
          green = sum(c["close"] > c["open"] for c in last5)
          red = sum(c["close"] < c["open"] for c in last5)

          signal = "NO SIGNAL ⚪"
          reason = "Arah belum jelas"

          if e9 > e21 and rv > 50 and green >= 3:
              signal = "BUY 🟢"
              reason = "EMA naik, RSI bullish, mayoritas candle hijau"
          elif e9 < e21 and rv < 50 and red >= 3:
              signal = "SELL 🔴"
              reason = "EMA turun, RSI bearish, mayoritas candle merah"

          last = last5[-1]
          wib = timezone(timedelta(hours=7))
          t = datetime.fromtimestamp(
              last["time"] / 1000, tz=timezone.utc
          ).astimezone(wib)

          message = (
              "🤖 BOT AI STOCKITY\n\n"
              f"Prediksi: {signal}\n"
              "Timeframe: M5\n"
              f"Candle terakhir: {t:%H:%M} WIB\n\n"
              f"Candle hijau: {green}/5\n"
              f"Candle merah: {red}/5\n"
              f"EMA 9: {e9:.2f}\n"
              f"EMA 21: {e21:.2f}\n"
              f"RSI 14: {rv:.2f}\n\n"
              f"Analisis: {reason}\n"
              "Catatan: prediksi tidak menjamin hasil."
          )

          sent = requests.post(
              f"https://api.telegram.org/bot{token}/sendMessage",
              json={"chat_id": chat_id, "text": message},
              timeout=20
          )

          if not sent.ok:
              raise SystemExit(
                  f"Telegram HTTP {sent.status_code}. "
                  "Periksa token dan Chat ID."
              )

          result = sent.json()
          if not result.get("ok"):
              raise SystemExit(
                  "Telegram error: " + str(result.get("description"))
              )

          print("Berhasil: sinyal terkirim ke Telegram.")
          PY
