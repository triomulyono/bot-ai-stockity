name: Bot AI Stockity

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Tes koneksi Telegram
        env:
          TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import requests

          token = os.getenv("TOKEN", "").strip()
          chat = os.getenv("CHAT", "").strip()

          print("Token tersedia:", bool(token))
          print("Chat ID tersedia:", bool(chat))

          if not token or not chat:
              raise SystemExit(
                  "Secret kosong. Periksa Repository secrets."
              )

          url = f"https://api.telegram.org/bot{token}/sendMessage"
          r = requests.post(
              url,
              data={
                  "chat_id": chat,
                  "text": "Tes berhasil. Bot AI Stockity terhubung ke Telegram."
              },
              timeout=20
          )

          print("Status Telegram:", r.status_code)
          print("Respons:", r.text[:500])
          r.raise_for_status()

          if not r.json().get("ok"):
              raise SystemExit("Telegram menolak pesan.")

          print("BERHASIL: Pesan terkirim.")
          PY
