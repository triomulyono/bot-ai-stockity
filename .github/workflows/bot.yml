name: Bot AI Stockity

on:
  workflow_dispatch:
  schedule:
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"

permissions:
  contents: read

jobs:
  signal:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install libraries
        run: pip install requests

      - name: Generate signal
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import requests
          from datetime import datetime, timezone, timedelta

          def main():
              token = os.environ.get("TELEGRAM_TOKEN", "").strip()
              chat_id = os.environ.get("TELEGRAM_CHAT_ID", "").strip()

              if not token or not chat_id:
                  raise RuntimeError(
                      "Token atau Chat ID tidak terbaca. "
                      "Periksa Repository Secrets."
                  )

              url = "https://www.okx.com/api/v5/market/candles"
              params = {
                  "instId": "BTC-USDT",
                  "bar": "5m",
                  "limit": "100"
              }

              response = requests.get(
                  url, params=params, timeout=20
              )
              response.raise_for_status()
              data = response.json()

              if data.get("code") != "0" or not data.get("data"):
                  raise RuntimeError(
                      "OKX gagal memberikan data candle: "
                      + str(data.get("msg", "respons kosong"))
                  )

              # Ambil hanya candle yang sudah selesai.
              candles = []
              for row in data["data"]:
                  if row[8] == "1":
                      candles.append({
                          "time": int(row[0]),
                          "open": float(row[1]),
                          "high": float(row[2]),
                          "low": float(row[3]),
                          "close": float(row[4])
                      })

              candles.sort(key=lambda x: x["time"])

              if len(candles) < 30:
                  raise RuntimeError(
                      "Data candle selesai tidak mencukupi"
                  )

              closes = [c["close"] for c in candles]

              def calculate_ema(values, period):
                  alpha = 2 / (period + 1)
                  result = values[0]
                  for value in values[1:]:
                      result = (
                          alpha * value
                          + (1 - alpha) * result
                      )
                  return result

              def calculate_rsi(values, period=14):
                  changes = [
                      values[i] - values[i - 1]
                      for i in range(1, len(values))
                  ]

                  gains = [max(x, 0) for x in changes]
                  losses = [max(-x, 0) for x in changes]

                  avg_gain = sum(gains[:period]) / period
                  avg_loss = sum(losses[:period]) / period

                  for i in range(period, len(changes)):
                      avg_gain = (
                          avg_gain * (period - 1) + gains[i]
                      ) / period
                      avg_loss = (
                          avg_loss * (period - 1) + losses[i]
                      ) / period

                  if avg_loss == 0:
                      return 100 if avg_gain > 0 else 50

                  return 100 - (
                      100 / (1 + avg_gain / avg_loss)
                  )

              ema9 = calculate_ema(closes, 9)
              ema21 = calculate_ema(closes, 21)
              rsi14 = calculate_rsi(closes, 14)

              last5 = candles[-5:]
              bullish = sum(
                  c["close"] > c["open"] for c in last5
              )
              bearish = sum(
                  c["close"] < c["open"] for c in last5
              )

              signal = "NO SIGNAL ⚪"
              reason = "Arah candle belum meyakinkan"

              if (
                  ema9 > ema21
                  and rsi14 > 50
                  and bullish >= 3
              ):
                  signal = "BUY 🟢"
                  reason = (
                      "EMA naik, RSI bullish, "
                      "dan mayoritas candle hijau"
                  )
              elif (
                  ema9 < ema21
                  and rsi14 < 50
                  and bearish >= 3
              ):
                  signal = "SELL 🔴"
                  reason = (
                      "EMA turun, RSI bearish, "
                      "dan mayoritas candle merah"
                  )

              last = last5[-1]
              wib = timezone(timedelta(hours=7))
              candle_time = datetime.fromtimestamp(
                  last["time"] / 1000,
                  tz=timezone.utc
              ).astimezone(wib)

              message = (
                  "🤖 BOT AI STOCKITY\n\n"
                  f"Prediksi: {signal}\n"
                  "Timeframe: M5\n"
                  f"Candle terakhir: {candle_time:%H:%M} WIB\n\n"
                  f"Candle hijau: {bullish}/5\n"
                  f"Candle merah: {bearish}/5\n"
                  f"Harga terakhir: {last['close']:.2f}\n"
                  f"EMA 9: {ema9:.2f}\n"
                  f"EMA 21: {ema21:.2f}\n"
                  f"RSI 14: {rsi14:.2f}\n\n"
                  f"Analisis: {reason}\n"
                  "Catatan: prediksi tidak menjamin hasil."
              )

              telegram_url = (
                  f"https://api.telegram.org/bot{token}/sendMessage"
              )

              sent = requests.post(
                  telegram_url,
                  json={
                      "chat_id": chat_id,
                      "text": message
                  },
                  timeout=20
              )

              if not sent.ok:
                  raise RuntimeError(
                      "Telegram gagal: HTTP "
                      + str(sent.status_code)
                      + ". Periksa token dan Chat ID."
                  )

              result = sent.json()
              if not result.get("ok"):
                  raise RuntimeError(
                      "Telegram menolak pesan: "
                      + str(result.get("description", "unknown error"))
                  )

              print("Sinyal berhasil dikirim ke Telegram.")

          main()
          PY
